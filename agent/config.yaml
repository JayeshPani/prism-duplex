# Pinned runtime configuration. Pick a profile with PRISM_PROFILE=<name>.
default_profile: local-mac

seed: 7

coordinator:
  hold_read_ms: 350
  hold_state_ms: 700
  hold_incomplete_ms: 1800
  ack_after_ms: 700
  resume_grace_ms: 1200
  speak_results: true

profiles:
  # Daily development on Apple Silicon (M4 Pro 24 GB). $0.
  local-mac:
    llm: {base_url: "http://127.0.0.1:8081/v1", model: "mlx-community/Qwen3-8B-4bit",
          no_think: false, json_mode: false, max_tokens: 500}
    stt: {kind: parakeet-mlx, model: "mlx-community/parakeet-tdt-0.6b-v2"}
    tts: {kind: kokoro, voice: "af_heart", speed: 1.1}

  # Organizers' machine: single 48 GB NVIDIA GPU. Started by run_benchmark.sh.
  local-cuda:
    llm: {base_url: "http://127.0.0.1:8000/v1", model: "Qwen/Qwen3-14B-AWQ",
          no_think: true, json_mode: true, max_tokens: 500}
    stt: {kind: nemo-parakeet, model: "nvidia/parakeet-tdt-0.6b-v2"}
    tts: {kind: kokoro, voice: "af_heart", speed: 1.1}

  # Hosted LLM (Moonshot / Kimi), local speech. Cheap fallback / comparison.
  kimi:
    llm: {base_url: "https://api.moonshot.ai/v1", model: "kimi-k2.6", api_key_env: MOONSHOT_API_KEY, temperature: 1.0,
          no_think: false, json_mode: true, max_tokens: 600}
    stt: {kind: parakeet-mlx, model: "mlx-community/parakeet-tdt-0.6b-v2"}
    tts: {kind: kokoro, voice: "af_heart", speed: 1.1}
