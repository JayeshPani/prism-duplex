# Our OWN dev set of disfluent requests (written for this project; not derived
# from FDB-v3 items). Each turn is a list of transcript segments; a segment
# boundary simulates a pause long enough for the endpointer to fire.
# `gap_ms` = silence between segments. Expected calls are checked like the
# benchmark: exact multiset of tools + argument match ("*" = any value).

- id: syn_travel_01
  turns:
    - [["Hello there, I was hoping you could help me with some travel stuff."]]
    - [["So um, I want flights to Lisbon on the, uh, twelfth of June."]]
  expected: [{tool: search_flights, args: {destination: Lisbon, date: June 12}}]

- id: syn_travel_02
  turns:
    - [["Hi."]]
    - [["Find flights to Toronto on March 3rd -", "no wait, March 5th, sorry."]]
  gap_ms: 900
  expected: [{tool: search_flights, args: {destination: Toronto, date: March 5}}]

